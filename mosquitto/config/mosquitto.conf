# Permite conexões anônimas (sem autenticação)
allow_anonymous false

# Porta padrão do MQTT
listener 1883

# Habilita WebSockets
listener 9001
protocol websockets
persistence true

# LOGS
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
persistence_location /mosquitto/data/
password_file /mosquitto/config/passwd